main = ".open-next/worker.js"
name = "pricelist"
compatibility_date = "2026-10-16"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
APP_URL = "https://pricelistng.workers.dev"
AUTH_SECRET = "PLACEHOLDER_AUTH_SECRET"
DATABASE_URL = "postgresql://postgres:PLACEHOLDER@db.YOUR-PROJECT-ID.supabase.co:6543/postgres?pgbouncer=true"
NEXTAUTH_URL = "https://pricelistng.workers.dev"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "pricelist"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "pricelist-opennext-cache"

[images]
binding = "IMAGES"
